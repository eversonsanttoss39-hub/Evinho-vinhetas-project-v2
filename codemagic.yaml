workflows:
  evinho-android-apk:
    name: Evinho Vinhetas — Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v22.21.1
        java: 21
        scripts :
      - name: Preparar projeto
        script: |
          rm -rf appsrc
          mkdir -p appsrc
          unzip -q evinho-vinhetas-studio-project.zip -d appsrc
          cd appsrc/evinho-vinhetas-app
          npm install --no-audit --no-fund
      - name: Criar projeto Android Capacitor
        script: |
          cd appsrc/evinho-vinhetas-app
          npx cap add android
          npx cap sync android
      - name: Configurar Android SDK
        script: |
          cd appsrc/evinho-vinhetas-app/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Gerar APK instalável
        script: |
          cd appsrc/evinho-vinhetas-app/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - appsrc/evinho-vinhetas-app/android/app/build/outputs/apk/debug/app-debug.apk
